[project]
name = "source-resolution"
version = "0.1.0"
description = "DQ + name->chembl_id resolution for the input compound set."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
