[project]
name = "dwh-load"
version = "0.1.0"
description = "Load the Silver top-10 results into the Gold star schema."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pyarrow>=16.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
