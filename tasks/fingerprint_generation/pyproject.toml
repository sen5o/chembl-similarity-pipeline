[project]
name = "fingerprint-generation"
version = "0.1.0"
description = "Silver compute: Morgan fingerprints for the ChEMBL corpus -> S3."
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2026.3",
    "boto3>=1.34",
    "pyarrow>=16.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "moto[s3]>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
