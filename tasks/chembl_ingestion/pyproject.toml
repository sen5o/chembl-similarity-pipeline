[project]
name = "chembl-ingestion"
version = "0.1.0"
description = "Bronze layer: acquire the ChEMBL release dump, project 4 tables to S3."
requires-python = ">=3.11"
dependencies = [
    "chembl-downloader>=0.5",
    "requests>=2.31",
    "boto3>=1.34",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "moto[s3]>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
