[project]
name = "similarity-computation"
version = "0.1.0"
description = "Tanimoto similarity of source molecules vs the ChEMBL corpus; top-10 + tie flag."
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2026.3",
    "boto3>=1.34",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "moto[s3]>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
