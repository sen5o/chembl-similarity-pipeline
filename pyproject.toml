# Root dev-tooling config only. Each task under tasks/* has its own pyproject.toml
# with its runtime dependencies (container-per-task isolation).

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "logs"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "tasks/chembl_ingestion:tasks/source_resolution:tasks/fingerprint_generation"
exclude = ["migrations", "logs"]
